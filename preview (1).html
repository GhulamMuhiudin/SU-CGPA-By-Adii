<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced CGPA Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    text-align: center;
}

.container {
    width: 95%;
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, select {
    padding: 10px;
    margin: 5px;
    width: 140px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

h2 {
    margin-bottom: 10px;
}

.section {
    margin-top: 20px;
    border-top: 1px solid #ddd;
    padding-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h2>🎓 Advanced CGPA Calculator</h2>

<!-- MODE SELECT -->
<select id="mode" onchange="changeMode()">
    <option value="sem">Single Semester</option>
    <option value="year">Year (2 Sem)</option>
    <option value="all">Full CGPA (8 Sem)</option>
</select>

<div id="inputs"></div>

<button onclick="calculate()">Manual Calculate</button>

<h3 id="result"></h3>

<div class="section">
<h3>📸 Upload Result Screenshot</h3>

<input type="file" id="imageUpload" accept="image/*">
<br>
<button onclick="processImage()">Auto Calculate from Image</button>

<p id="ocrText" style="white-space: pre-wrap; text-align:left;"></p>
</div>

</div>

<script>

// ----------- DYNAMIC INPUTS -----------
function changeMode() {
    let mode = document.getElementById("mode").value;
    let div = document.getElementById("inputs");
    div.innerHTML = "";

    if (mode === "sem") {
        div.innerHTML = `
            <p>Single Semester</p>
            <input id="qp1" type="number" placeholder="Total QP">
            <input id="ch1" type="number" placeholder="Credit Hours">
        `;
    }

    else if (mode === "year") {
        div.innerHTML = `
            <p>Semester 1</p>
            <input id="qp1" type="number" placeholder="QP">
            <input id="ch1" type="number" placeholder="CH">

            <p>Semester 2</p>
            <input id="qp2" type="number" placeholder="QP">
            <input id="ch2" type="number" placeholder="CH">
        `;
    }

    else if (mode === "all") {
        for (let i = 1; i <= 8; i++) {
            div.innerHTML += `
                <p>Semester ${i}</p>
                <input id="qp${i}" type="number" placeholder="QP">
                <input id="ch${i}" type="number" placeholder="CH">
            `;
        }
    }
}

changeMode();

// ----------- MANUAL CALCULATION -----------
function calculate() {
    let mode = document.getElementById("mode").value;
    let totalQP = 0;
    let totalCH = 0;

    if (mode === "sem") {
        totalQP = Number(qp1.value);
        totalCH = Number(ch1.value);
    }

    else if (mode === "year") {
        totalQP = Number(qp1.value) + Number(qp2.value);
        totalCH = Number(ch1.value) + Number(ch2.value);
    }

    else {
        for (let i = 1; i <= 8; i++) {
            totalQP += Number(document.getElementById("qp"+i).value || 0);
            totalCH += Number(document.getElementById("ch"+i).value || 0);
        }
    }

    let cgpa = totalQP / totalCH;

    document.getElementById("result").innerText =
        totalCH ? "CGPA: " + cgpa.toFixed(2) : "Enter valid data";
}

// ----------- OCR PROCESS -----------
async function processImage() {
    const file = document.getElementById('imageUpload').files[0];

    if (!file) {
        alert("Upload image first");
        return;
    }

    document.getElementById("ocrText").innerText = "Processing...";

    const result = await Tesseract.recognize(file, 'eng');

    const text = result.data.text;

    document.getElementById("ocrText").innerText = text;

    extractAndCalculate(text);
}

// ----------- PARSE & AUTO CALCULATE -----------
function extractAndCalculate(text) {
    let lines = text.split("\n");

    let totalQP = 0;
    let totalCH = 0;

    lines.forEach(line => {

        let match = line.match(/(A\+|A|B\+|B)\s+(\d+(\.\d+)?)/);

        if (match) {
            let grade = match[1];
            let qp = parseFloat(match[2]);

            let ch = 0;

            if (grade === "A+") ch = qp / 4.0;
            if (grade === "A") ch = qp / 3.6;
            if (grade === "B+") ch = qp / 3.2;
            if (grade === "B") ch = qp / 2.8;

            totalQP += qp;
            totalCH += ch;
        }
    });

    let cgpa = totalQP / totalCH;

    document.getElementById("result").innerText =
        "Auto CGPA: " + cgpa.toFixed(2);
}

</script>

</body>
</html>
